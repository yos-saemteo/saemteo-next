<!doctype html>

<title>이어가기 — 청년샘터</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #EEF3F7; }
  body { color: #18283A; font-family: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; }
  .testbar { padding: 6px 12px; background: #7D5208; color: #fff; font-size: 12.5px; line-height: 1.4; text-align: center; }
  .page { max-width: 480px; min-height: 80vh; margin: 0 auto; padding: 12px 20px 28px; display: flex; flex-direction: column; }
  .back { display: inline-flex; align-items: center; gap: 2px; min-height: 52px; color: #1B3A5C; font-size: 15px; font-weight: 600; text-decoration: none; align-self: flex-start; }
  h1 { margin: 28px 4px 0; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; line-height: 1.3; color: #1B3A5C; }
  p { margin: 12px 4px 0; font-size: 16px; line-height: 1.65; color: #56636F; }
  .box { margin-top: 20px; padding: 12px 14px; border-radius: 12px; background: #FBEFD9; color: #7D5208; font-size: 14px; line-height: 1.6; }
  .btn { margin-top: 24px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1B3A5C; color: #fff; font-size: 17px; font-weight: 600; text-decoration: none; }
</style>
</head>

<div class="testbar">테스트 페이지입니다 · 이어가기는 아직 접수되지 않습니다</div>
<div class="page">
  <a class="back" href="../"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>홈</a>
  <h1>이어가기</h1>
  <p>이번 달 샘터를 그대로 다음 달에도 이어서 신청하는 화면입니다.</p>
  <div class="box">이 화면은 아직 만드는 중이에요. 다음 단계에서 테스트용 응답시트와 함께 연결됩니다.</div>
  <a class="btn" href="../">홈으로 돌아가기</a>
</div>

</html>
